name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-content:
    name: Validar fichas JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar todas las fichas
        run: npm run validate

  e2e-tests:
    name: Tests Playwright
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build (Pagefind search index)
        run: npm run build

      - name: Instalar Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Ejecutar tests
        run: npx playwright test

      - name: Subir resultados (si hay fallos)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
